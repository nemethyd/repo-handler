#!/usr/bin/env bash
# image-repo.cfg
# Configuration for image-repo.sh

# Local image store (mirrored image content)
LOCAL_IMAGE_PATH="/repo/images/kubernetes/v1.37"

# Image list (one image per line)
IMAGES_FILE="${SCRIPT_DIR}/images/kubernetes-v1.37.0.txt"

# Lock file with source image + digest
ARCHIVE_DIGESTS_FILE="${LOCAL_IMAGE_PATH}/images.lock"

# Sync behavior
SYNC_MODE="remote"            # remote | none
NO_SYNC=0
SYNC_ONLY=0
PUBLISH=0
PUBLISH_ONLY=0

# Remote sync target (same host family as myrepo)
REMOTE_SYNC_HOST="mgmt3"
REMOTE_SYNC_USER="nemethy"
REMOTE_SYNC_TARGET_BASE="D:/repo/OracleLinux/OL9/kubernetes-images/v1.37"
REMOTE_SYNC_TARGET_STYLE="gitbash"   # gitbash | cygwin | unix
REMOTE_SYNC_REMOTE_OS="windows"      # windows | unix
REMOTE_SYNC_SSH_OPTS="-o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/nemethy/.ssh/known_hosts -i /home/nemethy/.ssh/id_rsa"

# Control flags
DRY_RUN=0
FORCE_REFRESH=0

# Architecture mode
# 0 = single-arch copy (faster), 1 = all architectures (slower)
COPY_ALL_ARCHES=0
IMAGE_OS="linux"
IMAGE_ARCH="amd64"

# Publish defaults (used by image-repo.sh --publish or --publish-only)
TARGET_REGISTRY="mgmt2.kafir.police.hu:5000"
TARGET_NAMESPACE="registry.k8s.io"
DEST_TLS_VERIFY="false"
